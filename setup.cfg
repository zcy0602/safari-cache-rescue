[metadata]
name = safari-cache-rescue
version = 0.1.0
description = Recover recently cached HTML documents from Safari on macOS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = safari-cache-rescue contributors
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    safari-rescue = safari_cache_rescue.cli:entrypoint
